[project]
name = "team5-incrementality"
version = "1.0.0"
description = "Incrementality audit for Vantage Performance Group: which ad spend actually works (Criteo uplift RCT)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "pyarrow>=15",
    "streamlit>=1.50",
]

[dependency-groups]
# Only needed to rebuild data/ from the raw 13.98M-row dataset.
prep = [
    "datasets>=2.19",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
